<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="300" fill="url(#grid)" rx="12" />

  <!-- Dynamic Background Telemetry Waveforms (Low Opacity behind Text) -->
  <g opacity="0.25">
    <!-- Animated Oscilloscope Trace 1 -->
    <path d="M 50,220 Q 150,280 250,180 T 450,200 T 650,140 T 850,240 T 1050,160 T 1150,210" fill="none" stroke="#58a6ff" stroke-width="2">
      <animate attributeName="d" 
        values="M 50,220 Q 150,280 250,180 T 450,200 T 650,140 T 850,240 T 1050,160 T 1150,210;
                M 50,200 Q 150,140 250,220 T 450,160 T 650,250 T 850,170 T 1050,220 T 1150,180;
                M 50,220 Q 150,280 250,180 T 450,200 T 650,140 T 850,240 T 1050,160 T 1150,210" 
        dur="10s" repeatCount="indefinite" />
    </path>

    <!-- Animated Oscilloscope Trace 2 -->
    <path d="M 50,80 Q 200,20 350,110 T 600,60 T 850,130 T 1150,70" fill="none" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4,4">
      <animate attributeName="d" 
        values="M 50,80 Q 200,20 350,110 T 600,60 T 850,130 T 1150,70;
                M 50,110 Q 200,140 350,50 T 600,120 T 850,60 T 1150,110;
                M 50,80 Q 200,20 350,110 T 600,60 T 850,130 T 1150,70" 
        dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Glowing Telemetry Nodes (Background animation) -->
  <g fill="#3fb950" opacity="0.6">
    <circle cx="250" cy="180" r="4">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="140" r="5">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="240" r="4">
      <animate attributeName="r" values="2;5;2" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Top and Bottom Border Glow -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#primaryGlow)" />
  <rect x="0" y="297" width="1200" height="3" fill="url(#primaryGlow)" />

  <!-- Foreground Main Content (Clear, High Contrast & High Z-Index) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="460" y="38" width="280" height="28" rx="14" fill="#1f242c" stroke="#30363d" stroke-width="1" />
    <text x="600" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#58a6ff" letter-spacing="1.5">
      CURATED ECOSYSTEM LIST
    </text>

    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5" filter="url(#glow)">
      Awesome AI Observability
    </text>

    <!-- Subtitle -->
    <text x="600" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8b949e">
      LLM Tracing • Prompt Monitoring • Agent Spans • Eval Dashboards • Production Telemetry
    </text>

    <!-- Feature Pills -->
    <g transform="translate(300, 210)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="24" cy="18" r="5" fill="#3fb950" />
        <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#c9d1d9">SaaS Platforms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(210, 0)">
        <rect width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="24" cy="18" r="5" fill="#58a6ff" />
        <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#c9d1d9">Open-Source Core</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(420, 0)">
        <rect width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="24" cy="18" r="5" fill="#bc8cff" />
        <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#c9d1d9">OpenTelemetry</text>
      </g>
    </g>
  </g>
</svg>
